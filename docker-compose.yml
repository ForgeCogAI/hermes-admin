services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8011:8000"
    volumes:
      - "${ADMIN_DATA_DIR:-~/.hermes-admin}:/data"
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ADMIN_DATA_DIR=/data
      - HERMES_IMAGE=${HERMES_IMAGE:-hermes-agent}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3011:80"
    depends_on:
      - backend
